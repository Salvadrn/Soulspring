# XcodeGen spec.
# Optional: regenerate the .xcodeproj from this file by running
#   brew install xcodegen
#   xcodegen generate
#
# The committed Soulspring.xcodeproj is generated from scripts/generate_xcodeproj.py
# for teams that don't want to install XcodeGen. Both produce an equivalent project.

name: Soulspring
options:
  bundleIdPrefix: mx.soulspring
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: "YES"

targets:
  Soulspring:
    type: application
    platform: iOS
    sources:
      - path: Soulspring
        excludes:
          - "SupportingFiles/Info.plist"
          - "SupportingFiles/Soulspring.entitlements"
    info:
      path: Soulspring/SupportingFiles/Info.plist
    entitlements:
      path: Soulspring/SupportingFiles/Soulspring.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.soulspring.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Soulspring/SupportingFiles/Soulspring.entitlements
        INFOPLIST_FILE: Soulspring/SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: HealthKit.framework
